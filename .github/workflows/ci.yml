name: CI

on:
  push:
    branches:
      - main
      - 'feature/*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout do código
      - name: Checkout code
        uses: actions/checkout@v2

      # Configurar variáveis de ambiente usando secrets do GitHub
      - name: Set environment variables
        run: |
          echo "DB_DRIVER=com.mysql.cj.jdbc.Driver" >> $GITHUB_ENV
          echo "DB_URL=jdbc:mysql://127.0.0.1:3306/playdb?useSSL=false" >> $GITHUB_ENV
          echo "MY_USERNAME=${{ secrets.MY_USERNAME }}" >> $GITHUB_ENV
          echo "MY_PASSWORD=${{ secrets.MY_PASSWORD }}" >> $GITHUB_ENV
          echo "MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}" >> $GITHUB_ENV

      # Iniciar o contêiner MySQL
      - name: Start MySQL container
        run: |
          docker run --name mysql-container -e MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }} \
            -e MYSQL_DATABASE=playdb -d -p 3306:3306 mysql:8.0.28

      # Build da imagem Docker
      - name: Build Docker image
        run: |
          docker build -t my-app-image .

      # Tag da imagem Docker
      - name: Tag Docker image
        run: |
          docker tag my-app-image ghcr.io/miguelarfigueiredo/teste/my-app-image:latest

      # Autenticar no GitHub Container Registry
      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Push da imagem Docker
      - name: Push Docker image
        run: |
          docker push ghcr.io/miguelarfigueiredo/teste/my-app-image:latest

      # (Opcional) Executar o container da aplicação
      - name: Run Docker container
        run: |
          docker run -d --env DB_DRIVER=com.mysql.cj.jdbc.Driver \
                        --env DB_URL=jdbc:mysql://127.0.0.1:3306/playdb?useSSL=false \
                        --env MY_USERNAME=${{ secrets.MY_USERNAME }} \
                        --env MY_PASSWORD=${{ secrets.MY_PASSWORD }} \
                        my-app-image

      # (Opcional) Parar e remover o contêiner MySQL após os testes
      - name: Clean up
        run: |
          if [ $(docker ps -q -f name=mysql-container) ]; then
            docker stop mysql-container
            docker rm mysql-container
          fi
