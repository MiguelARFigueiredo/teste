name: CI

on:
  push:
    branches:
      - main
      - 'feature/*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK
        uses: actions/setup-java@v1
        with:
          java-version: '8'  # ou a versão que você estiver usando

      - name: Build with sbt
        env:
          MY_USERNAME: ${{ secrets.MY_USERNAME }}
          MY_PASSWORD: ${{ secrets.MY_PASSWORD }}
        run: sbt clean compile

      - name: Upload compiled files
        uses: actions/upload-artifact@v3  # Atualizado para v3
        with:
          name: compiled-files
          path: target/universal/stage  # Ajuste este caminho para onde os arquivos compilados estão

      - name: Download compiled files
        uses: actions/download-artifact@v3  # Atualizado para v3
        with:
          name: compiled-files

      - name: Build Docker image
        run: |
          docker build -t my-app-image .
        env:
          MY_USERNAME: ${{ secrets.MY_USERNAME }}
          MY_PASSWORD: ${{ secrets.MY_PASSWORD }}
