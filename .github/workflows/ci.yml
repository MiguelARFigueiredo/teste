name: CI

on:
  push:
    branches:
      - main
      - 'feature/*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout do código
      - name: Checkout code
        uses: actions/checkout@v2

      # Configurar variáveis de ambiente usando secrets do GitHub
      - name: Set environment variables
        run: |
          echo "MY_USERNAME=${{ secrets.MY_USERNAME }}" >> $GITHUB_ENV
          echo "MY_PASSWORD=${{ secrets.MY_PASSWORD }}" >> $GITHUB_ENV

      # Criar arquivo .env para Docker Compose
      - name: Create .env file for Docker Compose
        run: |
          echo "MY_USERNAME=${{ secrets.MY_USERNAME }}" >> .env
          echo "MY_PASSWORD=${{ secrets.MY_PASSWORD }}" >> .env

      # Criar uma rede Docker (não necessário com Docker Compose)
      # - name: Create Docker network
      #   run: |
      #     docker network create my-network

      # Build da imagem Docker com Docker Compose
      - name: Build and start services with Docker Compose
        run: |
          docker-compose up -d --build

      # Aguardar o MySQL inicializar (docker-compose já gerencia isso com depends_on)
      # - name: Wait for MySQL to be ready
      #   run: |
      #     for i in {1..60}; do
      #       if docker exec mysql-container mysql -u root -p${{ secrets.MY_PASSWORD }} -e "SELECT 1" > /dev/null 2>&1; then
      #         echo "MySQL is ready!"
      #         break
      #       fi
      #       echo "Waiting for MySQL..."
      #       sleep 1
      #     done

      # Autenticar no GitHub Container Registry
      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Push da imagem Docker
      - name: Push Docker image
        run: |
          docker-compose push

      # Parar e remover o contêiner MySQL e aplicação após os testes
      - name: Stop and clean up containers
        run: |
          docker-compose down
