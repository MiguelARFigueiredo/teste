name: CI

on:
  push:
    branches:
      - main
      - 'feature/*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout do código
      - name: Checkout code
        uses: actions/checkout@v2

      # Build da imagem Docker
      - name: Build Docker image
        run: |
          docker build -t my-app-image .

      # Tag da imagem Docker com o GitHub Container Registry
      - name: Tag Docker image
        run: |
          docker tag my-app-image ghcr.io/miguelarfigueiredo/teste/my-app-image:latest

      # Autenticar no GitHub Container Registry
      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Push da imagem Docker para o GitHub Container Registry
      - name: Push Docker image
        run: |
          docker push ghcr.io/miguelarfigueiredo/teste/my-app-image:latest
