name: CI

on:
  push:
    branches:
      - main
      - 'feature/*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout do código
      - name: Checkout code
        uses: actions/checkout@v2

      # Configurar variáveis de ambiente usando secrets do GitHub
      - name: Set environment variables
        run: |
          echo "DB_DRIVER=com.mysql.cj.jdbc.Driver" >> $GITHUB_ENV
          echo "DB_URL=jdbc:mysql://127.0.0.1:3306/playdb?useSSL=false" >> $GITHUB_ENV
          echo "MY_USERNAME=${{ secrets.MY_USERNAME }}" >> $GITHUB_ENV
          echo "MY_PASSWORD=${{ secrets.MY_PASSWORD }}" >> $GITHUB_ENV

      # Iniciar o contêiner MySQL
      - name: Start MySQL container
        run: |
          docker run --name mysql-container -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=playdb -d -p 3306:3306 mysql:8.0.28

      # Build da imagem Docker
      - name: Build Docker image
        run: |
          docker build -t my-app-image .

      # Fazer login no GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Enviar a imagem para o GitHub Container Registry
      - name: Push Docker image
        run: |
          docker tag my-app-image ghcr.io/${{ github.repository }}/my-app-image:latest
          docker push ghcr.io/${{ github.repository }}/my-app-image:latest

      # (Opcional) Parar e remover o contêiner MySQL após os testes
      - name: Clean up
        run: |
          docker stop mysql-container
          docker rm mysql-container
