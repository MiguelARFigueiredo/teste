name: CI

on:
  push:
    branches:
      - main
      - 'feature/*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout do código
      - name: Checkout code
        uses: actions/checkout@v2

      # Build da imagem Docker
      - name: Build Docker image
        run: |
          docker build -t my-app-image .

      # Tag da imagem Docker
      - name: Tag Docker image
        run: |
          docker tag my-app-image ghcr.io/miguelarfigueiredo/teste/my-app-image:latest

      # Autenticar no GitHub Container Registry
      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Push da imagem Docker
      - name: Push Docker image
        run: |
          docker push ghcr.io/miguelarfigueiredo/teste/my-app-image:latest

      # Executar o contêiner do MySQL
      - name: Run MySQL container
        run: |
          docker run --name mysql-container -e MYSQL_ROOT_PASSWORD=1234 -e MYSQL_DATABASE=playdb -p 3307:3306 -d mysql:latest

      # Executar o contêiner da aplicação
      - name: Run Docker container
        run: |
          docker run -d --name app-container --env DB_DRIVER=com.mysql.cj.jdbc.Driver \
                        --env DB_URL=jdbc:mysql://mysql-container:3306/playdb?useSSL=false \
                        --env DB_USERNAME=root \
                        --env DB_PASSWORD=1234 \
                        my-app-image

      # Aguardar a aplicação iniciar e verificar a conexão com o banco de dados
      - name: Wait for application and check DB connection
        run: |
          for i in {1..60}; do
            if docker exec app-container sh -c 'mysql -h mysql-container -u root -p"1234" -e "SELECT 1"' > /dev/null 2>&1; then
              echo "Database connected successfully!"
              break
            fi
            echo "Waiting for database connection..."
            sleep 1
          done
    
