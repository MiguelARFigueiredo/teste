name: CI

on:
  push:
    branches:
      - main
      - 'feature/*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK
        uses: actions/setup-java@v1
        with:
          java-version: '8'  # ou a versão que você estiver usando

      - name: Build with sbt
        run: sbt clean compile package  # Este comando gera o arquivo compilado

      - name: List target directory
        run: ls -R target  # Verifique o conteúdo da pasta target para inspecionar onde os artefatos estão

      - name: Upload compiled files
        uses: actions/upload-artifact@v3
        with:
          name: compiled-files
          path: target/scala-*/  # Verifique o caminho correto dos arquivos gerados
