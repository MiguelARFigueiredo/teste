name: CI

on:
  push:
    branches:
      - main
      - 'feature/*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout do código
      - name: Checkout code
        uses: actions/checkout@v2

      # Configurar variáveis de ambiente usando secrets do GitHub
      - name: Set environment variables
        run: |
          echo "MY_USERNAME=${{ secrets.MY_USERNAME }}" >> $GITHUB_ENV
          echo "MY_PASSWORD=${{ secrets.MY_PASSWORD }}" >> $GITHUB_ENV

      # Build da imagem Docker
      - name: Build Docker image
        run: |
          docker build -t my-app-image .

      # Tag da imagem Docker
      - name: Tag Docker image
        run: |
          docker tag my-app-image ghcr.io/miguelarfigueiredo/teste/my-app-image:latest

      # Autenticar no GitHub Container Registry
      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Push da imagem Docker
      - name: Push Docker image
        run: |
          docker push ghcr.io/miguelarfigueiredo/teste/my-app-image:latest

      # Executar o container da aplicação (conectando ao MySQL)
      - name: Run Docker container
        run: |
          docker run -d --name app-container --env DB_DRIVER=com.mysql.cj.jdbc.Driver \
                        --env DB_URL=jdbc:mysql://host.docker.internal:3306/playdb?useSSL=false \
                        --env DB_USERNAME=${{ secrets.MY_USERNAME }} \
                        --env DB_PASSWORD=${{ secrets.MY_PASSWORD }} \
                        my-app-image

      # Aguardar a aplicação iniciar e verificar conexão com o banco de dados
      - name: Wait for application and check DB connection
        run: |
          for i in {1..60}; do
            if docker exec app-container sh -c 'mysql -h host.docker.internal -u $MY_USERNAME -p"$MY_PASSWORD" -e "SELECT 1"' > /dev/null 2>&1; then
              echo "Database connected successfully!"
              break
            fi
            echo "Waiting for database connection..."
            sleep 1
          done
