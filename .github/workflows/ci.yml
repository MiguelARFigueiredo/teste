name: CI

on:
  push:
    branches:
      - main
      - 'feature/*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout do código
      - name: Checkout code
        uses: actions/checkout@v2

      # Configurar variáveis de ambiente usando secrets do GitHub
      - name: Set environment variables
        run: |
          echo "MY_USERNAME=${{ secrets.MY_USERNAME }}" >> $GITHUB_ENV
          echo "MY_PASSWORD=${{ secrets.MY_PASSWORD }}" >> $GITHUB_ENV

      # Criar uma rede Docker
      - name: Create Docker network
        run: |
          docker network create my-network || echo "Network already exists"

      # Iniciar o contêiner MySQL com MY_PASSWORD como senha root
      - name: Start MySQL container
        run: |
          docker run --name mysql-container --network my-network -e MYSQL_ROOT_PASSWORD=${{ secrets.MY_PASSWORD }} \
            -e MYSQL_DATABASE=playdb -d -p 3306:3306 mysql:8.0.28

      # Verificar se o contêiner MySQL foi criado
      - name: Check MySQL container
        run: |
          if [ $(docker ps -q -f name=mysql-container) ]; then
            echo "MySQL container is running."
          else
            echo "MySQL container is not running." && exit 1
          fi

      # Aguardar o MySQL inicializar (tentativa de conexão até 60 segundos)
      - name: Wait for MySQL to be ready
        run: |
          for i in {1..60}; do
            if docker exec mysql-container mysql -u root -p${{ secrets.MY_PASSWORD }} -e "SELECT 1" > /dev/null 2>&1; then
              echo "MySQL is ready!"
              break
            fi
            echo "Waiting for MySQL..."
            sleep 1
          done

      # Build da imagem Docker
      - name: Build Docker image
        run: |
          docker build -t my-app-image .

      # Tag da imagem Docker
      - name: Tag Docker image
        run: |
          docker tag my-app-image ghcr.io/miguelarfigueiredo/teste/my-app-image:latest

      # Autenticar no GitHub Container Registry
      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Push da imagem Docker
      - name: Push Docker image
        run: |
          docker push ghcr.io/miguelarfigueiredo/teste/my-app-image:latest

      # Executar o container da aplicação com DB_DRIVER e DB_URL diretamente
      - name: Run Docker container
        run: |
          docker run --network my-network -d --env DB_DRIVER=com.mysql.cj.jdbc.Driver \
                        --env DB_URL=jdbc:mysql://mysql-container:3306/playdb?useSSL=false \
                        --env MY_USERNAME=${{ secrets.MY_USERNAME }} \
                        --env MY_PASSWORD=${{ secrets.MY_PASSWORD }} \
                        my-app-image

      # Parar e remover o contêiner MySQL após os testes
      - name: Clean up
        run: |
          if [ $(docker ps -q -f name=mysql-container) ]; then
            docker stop mysql-container
            docker rm mysql-container
          fi
          # Remover a rede Docker
          docker network rm my-network || echo "Network does not exist"
