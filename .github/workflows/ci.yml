name: CI

on:
  push:
    branches:
      - main
      - 'feature/*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout do código
      - name: Checkout code
        uses: actions/checkout@v2

      # Build da imagem Docker
      - name: Build Docker image
        run: |
          docker build -t my-app-image .

      # Tag da imagem Docker
      - name: Tag Docker image
        run: |
          docker tag my-app-image ghcr.io/miguelarfigueiredo/teste/my-app-image:latest

      # Autenticar no GitHub Container Registry
      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Push da imagem Docker
      - name: Push Docker image
        run: |
          docker push ghcr.io/miguelarfigueiredo/teste/my-app-image:latest

      # Executar o contêiner da aplicação sem o MySQL no Docker
      - name: Run Docker container
        run: |
          docker run -d --name app-container --env DB_DRIVER=com.mysql.cj.jdbc.Driver \
                        --env DB_URL=jdbc:mysql://host.docker.internal:3306/playdb?useSSL=false \
                        --env DB_USERNAME=root \
                        --env DB_PASSWORD=1234 \
                        my-app-image